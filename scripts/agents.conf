# Which AI does which job. Change here to switch roles. No other file needs to change.
IMPLEMENTER=codex        # codex | claude   - writes code and tests
REVIEWER=claude          # claude | codex   - reviews, never edits

# Optional model choice (empty = CLI default). Examples: CLAUDE_MODEL=sonnet, CLAUDE_MODEL=opus
CLAUDE_MODEL=sonnet
CODEX_MODEL=gpt-5.6-luna

# Safety limits
MAX_REVIEW_ROUNDS=10     # per task; 0 = unlimited (MAX_SESSIONS still protects)
MAX_BUILD_FIX_TRIES=3    # implementer sessions allowed to fix a red build in a row
MAX_SESSIONS=100         # total agent sessions per run-until call

# Usage limits: when an agent reports a usage/rate limit, wait and retry the same step.
LIMIT_WAIT_MINUTES=30
LIMIT_MAX_WAITS=16       # 16 x 30 min = 8 hours, then stop
