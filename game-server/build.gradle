plugins {
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

dependencies {
    implementation project(':game-engine')
    implementation project(':game-ruleset-json')
    implementation project(':game-bots')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    // T24: MatchLog's postgres profile (Flyway migrations, JdbcTemplate, JSONB payload via PGobject).
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // T24: real PostgreSQL for tests, no Docker required.
    testImplementation 'io.zonky.test:embedded-postgres:2.2.2'
}

springBoot {
    mainClass = 'citytrade.server.GameServerApplication'
}

tasks.named('test') {
    // Tests load the real ruleset files from the repository root.
    systemProperty 'rulesets.dir', rootProject.file('rulesets').absolutePath
    // T22: a test parses the JSON examples in docs/PROTOCOL.md.
    systemProperty 'docs.dir', rootProject.file('docs').absolutePath
}
